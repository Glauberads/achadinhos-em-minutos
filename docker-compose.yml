# ============================================
# Achadinhos em Minutos — Docker Compose
# Prepared for VPS deployment (Fase 0)
# ============================================

services:
  # Redis — Required by BullMQ queues and CacheService
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - redis_data:/data
    networks:
      - internal
    # Redis is not exposed externally; only accessible within the Docker network.
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  # API (Fastify)
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped

    env_file:
      - apps/api/.env
    environment:
      - NODE_ENV=production
      - PORT=3001
      - REDIS_URL=redis://redis:6379
      - ENCRYPTION_KEY=${ENCRYPTION_KEY}
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - internal
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3001/health/live').then(r => { if (!r.ok) process.exit(1); }).catch(() => process.exit(1))"]
      interval: 30s
      timeout: 5s
      start_period: 15s
      retries: 3

  # Web (Nginx serving Vite build)
  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    restart: unless-stopped
    ports:
      - "${WEB_PORT:-80}:80"
    depends_on:
      api:
        condition: service_healthy
    networks:
      - internal

volumes:
  redis_data:

networks:
  internal:
    driver: bridge
